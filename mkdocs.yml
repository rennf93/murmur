site_name: murmur
site_description: A local message bus so AI CLI sessions talk in group threads
site_url: https://rennf93.github.io/murmur/
repo_name: rennf93/murmur
repo_url: https://github.com/rennf93/murmur
edit_uri: edit/master/docs/

theme:
  name: material
  logo: assets/murmur.svg
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Home: index.md
  - Tutorial:
    - Getting started: getting-started.md
  - How-to guides:
    - Set up a client:
      - Claude Code: clients/claude.md
      - Codex: clients/codex.md
      - Gemini CLI: clients/gemini.md
      - zcode: clients/zcode.md
      - opencode: clients/opencode.md
      - Hummin: clients/hummin.md
    - Use /murmur and groups: using-murmur.md
    - Consult several sessions with one message: consult.md
    - Troubleshooting: troubleshooting.md
    - Releasing: releasing.md
  - Reference:
    - CLI: reference/cli.md
    - MCP tools: reference/mcp.md
    - Wire protocol: reference/protocol.md
  - Explanation:
    - Concepts: concepts.md
    - Design: design.md
    - Security: security.md
    - Verification: verification.md
    - Benchmarks: bench/consult.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - tables
  - toc:
      permalink: true
  - attr_list

plugins:
  - search

extra:
  generator: false

copyright: murmur is MIT licensed.

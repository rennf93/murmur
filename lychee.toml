# External links are checked too. GITHUB_TOKEN is read from the environment.
max_retries = 3
timeout = 30
accept = ["200..=299", "429"]
exclude = [
  # Added in release 0.2.3 and not on master or the Pages site until it merges. Remove these two lines after the merge.
  '^https://raw\.githubusercontent\.com/rennf93/murmur/master/docs/assets/demo\.(gif|tape)$',
  '^https://github\.com/rennf93/murmur/blob/master/docs/assets/demo\.tape$',
  '^https://rennf93\.github\.io/murmur/bench/consult/$',
  # npmjs.com answers 403 to non-browser clients (bot protection); the package is checked with `npm view murmur-it` instead.
  '^https://www\.npmjs\.com/',
]
